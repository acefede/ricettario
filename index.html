<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e9eff4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Il ricettario di Fede e Vio">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Il ricettario di Fede e Vio">

  <title>Il ricettario di Fede e Vio</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png">
  <link rel="shortcut icon" type="image/png" href="./icon_png.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="description" content="Il ricettario di Fede e Vio: i nostri dolci, le ricette e i ricordi di casa.">

  <style>
    * { box-sizing: border-box; }
    html, body {
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
      margin: 0; width: 100%; height: 100%; min-height: 100%; overflow: hidden;
    }
    @supports (height: 100dvh) { html, body { height: 100dvh; } }
    @supports (height: 100svh) { html, body { min-height: 100svh; } }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #f4f0e7; color: #3f4650;
    }
    #status {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 13px; padding: 28px;
      text-align: center; font-size: 16px; line-height: 1.45;
      overflow-wrap: anywhere; background: linear-gradient(145deg, #fbf8f0, #e9eff4);
      z-index: 2;
    }
    #status .mark {
      width: 82px; height: 82px; border-radius: 22px; object-fit: cover;
      box-shadow: 0 8px 24px rgba(41, 78, 112, .18);
    }
    #status strong { color: #294e70; font-family: Georgia, serif; font-size: 21px; }
    #status .detail { color: #687887; font-size: 13px; max-width: 360px; }
    #app-frame {
      position: fixed; inset: 0; width: 100%; height: 100%; height: 100svh; height: 100dvh;
      border: 0; display: none; background: #f4f0e7; margin: 0; z-index: 1;
    }
  </style>
</head>
<body>
  <main id="status" role="status" aria-live="polite">
    <img class="mark" src="./icon_png.png" alt="">
    <strong>Il ricettario di Fede e Vio</strong>
    <span id="status-message">Preparazione del ricettario...</span>
    <span class="detail" id="status-detail"></span>
  </main>

  <iframe id="app-frame" title="Il ricettario di Fede e Vio" allow="clipboard-write"></iframe>

  <script>
    (() => {
      "use strict";
      const status = document.getElementById("status");
      const message = document.getElementById("status-message");
      const detail = document.getElementById("status-detail");
      const frame = document.getElementById("app-frame");

      const showError = (text, extra = "") => {
        message.textContent = text;
        detail.textContent = extra;
        status.style.display = "flex";
        frame.style.display = "none";
      };

      let value;
      try {
        value = decodeURIComponent(window.location.hash.slice(1)).trim();
      } catch (_) {
        showError("Il collegamento non è valido.", "Controlla l'indirizzo GitHub Pages.");
        return;
      }

      if (!value) {
        showError(
          "Manca il collegamento alla Web App.",
          "Apri GitHub Pages aggiungendo # seguito dall'ID del deployment Apps Script."
        );
        return;
      }

      const fullUrlPattern = /^https:\/\/script\.google\.com\/macros\/s\/([A-Za-z0-9_-]+)\/exec\/?$/;
      const fullMatch = value.match(fullUrlPattern);
      let appUrl;
      if (fullMatch) {
        appUrl = "https://script.google.com/macros/s/" + fullMatch[1] + "/exec";
      } else if (/^[A-Za-z0-9_-]+$/.test(value)) {
        appUrl = "https://script.google.com/macros/s/" + value + "/exec";
      } else {
        showError(
          "ID o indirizzo non valido.",
          "Inserisci l'ID del deployment oppure l'indirizzo completo che termina in /exec."
        );
        return;
      }

      message.textContent = "Apertura del ricettario...";
      detail.textContent = "Connessione a Google Apps Script";
      let loaded = false;
      const timeout = window.setTimeout(() => {
        if (!loaded) showError(
          "Il ricettario sta impiegando troppo tempo ad aprirsi.",
          "Controlla la connessione e verifica che la Web App sia ancora distribuita."
        );
      }, 25000);

      frame.addEventListener("load", () => {
        loaded = true;
        window.clearTimeout(timeout);
        status.style.display = "none";
        frame.style.display = "block";
      });
      frame.src = appUrl;
    })();
  </script>
</body>
</html>
